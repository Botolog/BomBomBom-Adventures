<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle Distance Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            padding: 2rem;
            color: #1f2937;
        }
        .container {
            background-color: #ffffff;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
        }
        canvas {
            border: 2px solid #e5e7eb;
            background-color: #f9fafb;
            border-radius: 0.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="container space-y-6">
        <h1 class="text-3xl font-bold text-center">Rectangle Distance Calculator</h1>
        <p class="text-center text-gray-600">Drag the red and blue rectangles to see the shortest distance update.</p>

        <div class="flex flex-col md:flex-row md:space-x-4">
            <!-- Canvas for drawing rectangles -->
            <div class="w-full md:w-2/3">
                <canvas id="rectCanvas" width="500" height="300" class="w-full h-auto max-w-full"></canvas>
            </div>
            
            <!-- Controls and output -->
            <div class="w-full md:w-1/3 mt-4 md:mt-0 space-y-4">
                <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg">
                    <h3 class="text-xl font-semibold mb-2">Distance</h3>
                    <div id="distanceOutput" class="text-2xl font-mono font-bold text-blue-600">0.00</div>
                </div>

                <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg">
                    <h3 class="text-xl font-semibold mb-2">Rectangle 1 (Red)</h3>
                    <p id="rect1Props" class="text-sm font-mono text-gray-700"></p>
                </div>
                
                <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg">
                    <h3 class="text-xl font-semibold mb-2">Rectangle 2 (Blue)</h3>
                    <p id="rect2Props" class="text-sm font-mono text-gray-700"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // JS code goes here
        
        /**
         * Represents a rectangle using its top-left corner and dimensions.
         */
        class Rectangle {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
            }
        }

        /**
         * Calculates the shortest distance between two rectangles.
         * @param {Rectangle} rect1 The first rectangle.
         * @param {Rectangle} rect2 The second rectangle.
         * @returns {number} The shortest distance. Returns 0 if the rectangles overlap.
         */
        function distanceBetweenRects(rect1, rect2) {
            // Horizontal distance
            const dx = Math.max(0, rect1.x - (rect2.x + rect2.width), rect2.x - (rect1.x + rect1.width));
            // Vertical distance
            const dy = Math.max(0, rect1.y - (rect2.y + rect2.height), rect2.y - (rect1.y + rect1.height));
            return Math.hypot(dx, dy);
        }

        const canvas = document.getElementById('rectCanvas');
        const ctx = canvas.getContext('2d');
        const distanceOutput = document.getElementById('distanceOutput');
        const rect1Props = document.getElementById('rect1Props');
        const rect2Props = document.getElementById('rect2Props');

        let rect1 = new Rectangle(240, 50, 80, 50);
        let rect2 = new Rectangle(250, 120, 80, 60);

        let dragging = null; // null, 1, or 2
        let lastMouseX = 0;
        let lastMouseY = 0;

        /**
         * Draws the rectangles on the canvas and updates the distance.
         */
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Rect 1 (Red)
            ctx.fillStyle = 'rgba(239, 68, 68, 0.7)';
            ctx.fillRect(rect1.x, rect1.y, rect1.width, rect1.height);
            ctx.strokeStyle = '#ef4444';
            ctx.strokeRect(rect1.x, rect1.y, rect1.width, rect1.height);

            // Draw Rect 2 (Blue)
            ctx.fillStyle = 'rgba(59, 130, 246, 0.7)';
            ctx.fillRect(rect2.x, rect2.y, rect2.width, rect2.height);
            ctx.strokeStyle = '#3b82f6';
            ctx.strokeRect(rect2.x, rect2.y, rect2.width, rect2.height);

            // Calculate and display distance
            const distance = distanceBetweenRects(rect1, rect2);
            distanceOutput.textContent = distance.toFixed(2);

            // Update property displays
            rect1Props.textContent = `x: ${rect1.x}, y: ${rect1.y}, w: ${rect1.width}, h: ${rect1.height}`;
            rect2Props.textContent = `x: ${rect2.x}, y: ${rect2.y}, w: ${rect2.width}, h: ${rect2.height}`;
            
            // Draw a line connecting the closest points if not overlapping
            if (distance > 0) {
                ctx.beginPath();
                ctx.strokeStyle = '#1f2937';
                ctx.lineWidth = 1;

                // Find the closest points on each rectangle
                const p1 = closestPointOnRect(rect1, rect2.x, rect2.y);
                const p2 = closestPointOnRect(rect2, rect1.x, rect1.y);

                // Find the point on rect1 that is closest to rect2's center
                const p1a = {
                    x: Math.max(rect1.x, Math.min(rect1.x + rect1.width, rect2.x + rect2.width / 2)),
                    y: Math.max(rect1.y, Math.min(rect1.y + rect1.height, rect2.y + rect2.height / 2))
                };
                // Find the point on rect2 that is closest to rect1's center
                const p2a = {
                    x: Math.max(rect2.x, Math.min(rect2.x + rect2.width, rect1.x + rect1.width / 2)),
                    y: Math.max(rect2.y, Math.min(rect2.y + rect2.height, rect1.y + rect1.height / 2))
                };
                
                ctx.moveTo(p1a.x, p1a.y);
                ctx.lineTo(p2a.x, p2a.y);
                ctx.stroke();
            }
        }
        
        // Helper function to find the closest point on a rectangle to a given point
        function closestPointOnRect(rect, pointX, pointY) {
            const closestX = Math.max(rect.x, Math.min(pointX, rect.x + rect.width));
            const closestY = Math.max(rect.y, Math.min(pointY, rect.y + rect.height));
            return { x: closestX, y: closestY };
        }

        // --- Mouse Events for Dragging ---
        
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (mouseX >= rect1.x && mouseX <= rect1.x + rect1.width && mouseY >= rect1.y && mouseY <= rect1.y + rect1.height) {
                dragging = 1;
            } else if (mouseX >= rect2.x && mouseX <= rect2.x + rect2.width && mouseY >= rect2.y && mouseY <= rect2.y + rect2.height) {
                dragging = 2;
            }
            lastMouseX = mouseX;
            lastMouseY = mouseY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (dragging === null) return;
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const dx = mouseX - lastMouseX;
            const dy = mouseY - lastMouseY;

            if (dragging === 1) {
                rect1.x += dx;
                rect1.y += dy;
            } else if (dragging === 2) {
                rect2.x += dx;
                rect2.y += dy;
            }

            lastMouseX = mouseX;
            lastMouseY = mouseY;
            draw();
        });

        canvas.addEventListener('mouseup', () => {
            dragging = null;
        });

        // Initial draw
        draw();
    </script>
</body>
</html>
